services:
  postgres:
    image: postgres:17-alpine
    container_name: jwt_api_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: jwt_api_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      TZ: America/Bogota
      PGTZ: America/Bogota
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d jwt_api_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - api_dev_network

  redis:
    image: redis:7-alpine
    container_name: jwt_api_redis_dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - api_dev_network

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  api_dev_network:
    driver: bridge
